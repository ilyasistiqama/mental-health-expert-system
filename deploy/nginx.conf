# Contoh konfigurasi nginx untuk VPS.
# Salin ke /etc/nginx/sites-available/sispak, sesuaikan server_name dan root,
# lalu: ln -s ../sites-available/sispak /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# Build untuk domain sendiri cukup "npm run build"; isi folder dist/ disalin ke "root" di bawah.

server {
    listen 80;
    server_name sispak.contoh.com;

    root /var/www/sispak/dist;
    index index.html;

    # alamat bersih: /artikel -> artikel.html, alamat lain -> index.html (aplikasi satu halaman)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # file ber-hash di assets/ tidak pernah berubah isinya, aman di-cache lama
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # service worker dan data JSON harus selalu dicek versi terbarunya
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Mode offline (service worker) hanya aktif di HTTPS. Pasang sertifikat gratis dengan Certbot:
#   certbot --nginx -d sispak.contoh.com
